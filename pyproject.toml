[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-typesense"
version = "0.1.0"
description = "An integration package connecting Typesense and LangChain"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["langchain", "typesense", "vector-store", "semantic-search", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
    "typesense>=2.0.0,<3.0.0",
]

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "pytest-xdist>=3.6",
]
test_integration = [
    # Pinned, not ranged: langchain-tests adds new assertions in minor
    # releases, which can silently break CI on an unpinned range.
    "langchain-tests==1.1.9",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
    "ty>=0.0.71",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-v"
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["langchain_typesense"]
